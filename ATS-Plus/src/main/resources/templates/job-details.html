<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${job.jobTitle}">Job Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/job-details.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Job Description Section -->
            <div class="col-lg-8 job-content">
                <div class="job-header">
                    <button onclick="history.back()" class="btn btn-outline-secondary mb-3">
                        <i class="fas fa-arrow-left me-2"></i>Back to Jobs
                    </button>
                    <h1 th:text="${job.jobTitle}">Job Title</h1>
                    <div class="job-meta">
                        <small class="text-muted">
                            <i class="fas fa-clock me-1"></i>
                            Posted on <span th:text="${#temporals.format(job.createdAt, 'MMM dd, yyyy')}">Date</span>
                        </small>
                    </div>
                </div>

                <!-- Job Description Content -->
                <div class="job-description">
                    <h3>Job Description</h3>
                    <div class="description-content" th:utext="${#strings.replace(job.description, chr(10), '&lt;br&gt;')}">
                        Job description content will be displayed here
                    </div>
                </div>
            </div>

            <!-- Application Form Section -->
            <div class="col-lg-4 application-sidebar">
                <div class="application-form">
                    <h4>Apply for this Position</h4>
                    <form enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="applicantName" class="form-label">Full Name *</label>
                            <input type="text" class="form-control" id="applicantName" required>
                        </div>

                        <div class="mb-3">
                            <label for="applicantEmail" class="form-label">Email Address *</label>
                            <input type="email" class="form-control" id="applicantEmail" required>
                        </div>

                        <div class="mb-3">
                            <label for="applicantPhone" class="form-label">Phone Number *</label>
                            <input type="tel" class="form-control" id="applicantPhone" required>
                        </div>

                        <div class="mb-3">
                            <label for="cvFile" class="form-label">Upload CV/Resume *</label>
                            <input type="file" class="form-control" id="cvFile" accept=".pdf,.doc,.docx" required>
                            <div class="form-text">Supported formats: PDF, DOC, DOCX</div>
                        </div>

                        <div class="mb-3">
                            <label for="coverLetter" class="form-label">Cover Letter (Optional)</label>
                            <textarea class="form-control" id="coverLetter" rows="4" placeholder="Tell us why you're interested in this position..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-paper-plane me-2"></i>Submit Application
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
