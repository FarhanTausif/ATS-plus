<!-- templates/fragments/card.html -->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="jobCard(job)" class="card" style="width: 18rem;" th:if="${job != null}">
    <div class="card-body">
        <h5 class="card-title" th:text="${job.jobTitle ?: 'No Title'}">Job Title</h5>
        <p class="card-text" th:text="${job.description != null ? #strings.abbreviate(job.description, 100) : 'No description available'}">Job Description</p>
        <div class="job-meta mb-3">
            <small class="text-muted">
                <i class="fas fa-clock me-1"></i>
                <span th:text="${job.createdAt != null ? #temporals.format(job.createdAt, 'MMM dd, yyyy') : 'Date not available'}">Posted Date</span>
            </small>
        </div>
        <a th:href="@{/job-details/{id}(id=${job.jobRequirementId})}" class="btn btn-primary">
            <i class="fas fa-eye me-2"></i>View Details
        </a>
    </div>
</div>
</body>
</html>
