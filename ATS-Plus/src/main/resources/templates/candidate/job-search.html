<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Job Search - ATS Plus</title>
    <!--add bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container main-container">
        <!-- Page Header -->
        <div class="page-header">
            <h1>Find Your Dream Job</h1>
            <p class="page-subtitle">Browse available opportunities and apply for positions</p>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <div class="row">
                <div class="col-md-8">
                    <input type="text" class="form-control search-input" placeholder="Search for jobs, skills, or companies...">
                </div>
                <div class="col-md-4">
                    <button class="btn btn-primary w-100">
                        <i class="fas fa-search me-2"></i>Search Jobs
                    </button>
                </div>
            </div>
        </div>

        <!-- Jobs Container -->
        <div class="jobs-container">
            <!-- Dynamic job cards from database using fragment -->
            <div th:if="${jobs != null and !#lists.isEmpty(jobs)}">
                <div th:each="job : ${jobs}" th:if="${job != null}" th:replace="fragments/card :: jobCard(${job})"></div>
            </div>

            <!-- No jobs message when list is empty -->
            <div th:if="${jobs == null or #lists.isEmpty(jobs)}" class="no-jobs">
                <i class="fas fa-briefcase"></i>
                <h4>No Jobs Found</h4>
                <p>No job openings are currently available. Check back later for new opportunities.</p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
