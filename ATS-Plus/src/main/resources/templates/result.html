<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CV Scoring Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .result-container {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .score-section {
            background-color: #e8f5e8;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #28a745;
            margin: 20px 0;
        }
        .method-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .gemini-badge {
            background-color: #4285f4;
            color: white;
        }
        .llama-badge {
            background-color: #34a853;
            color: white;
        }
        .content-section {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border: 1px solid #ddd;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.4;
            max-height: 300px;
            overflow-y: auto;
        }
        .back-button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            display: inline-block;
            margin-top: 20px;
        }
        .back-button:hover {
            background-color: #0056b3;
            text-decoration: none;
            color: white;
        }
        h2 {
            color: #333;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>
<h1>CV Scoring Result</h1>

<div class="result-container">
    <span th:class="${processingMethod == 'Gemini AI' ? 'method-badge gemini-badge' : 'method-badge llama-badge'}"
          th:text="'Processed using: ' + ${processingMethod}"></span>

    <div class="score-section">
        <h2>📊 Matching Score</h2>
        <div style="font-size: 24px; font-weight: bold; color: #28a745;" th:text="${score}"></div>
    </div>

    <div class="content-section">
        <h2>📄 Extracted CV Content</h2>
        <pre th:text="${cvContent}"></pre>
    </div>

    <div class="content-section">
        <h2>💼 Extracted Job Requirements Content</h2>
        <pre th:text="${jobContent}"></pre>
    </div>
    <p>PDF Parse Time: <span th:text="${pdfParseTimeMs}"></span> ms</p>
    <p>Summarization Time: <span th:text="${summarizeTimeMs}"></span> ms</p>
    <p>Scoring Time: <span th:text="${scoreTimeMs}"></span> ms</p>
</div>

<a href="/" class="back-button">🔄 Score Another CV</a>
</body>
</html>
